# PixelFx as a snap: core24 with the KDE Neon 6 extension (Qt 6 and KDE Frameworks from the
# kf6-core24 content snap), built by GitHub Actions only (.github/workflows/snap.yml; ADR-000,
# PLAN section 8). libvips and the codecs the runtime lacks are built here as parts, at the
# versions and checksums scripts/build-deps.sh pins for dev builds (ADR-008); their headers and
# the image libraries under them come from Ubuntu 24.04, the release core24 and the runtime are
# built from.
name: pixelfx
adopt-info: pixelfx
grade: stable
confinement: strict
base: core24
compression: lzo

title: PixelFx
summary: Photo editor, filters and presets
description: |
  PixelFx is a quick photo editor for the Linux desktop. Make a photo better while you watch it: one-click looks shown on your own photo, presets, every light and colour control you expect, and batch editing of many photos at once.

  **Looks and presets**

  * Looks: Vivid, Warm, Film, Golden hour, Teal and orange, Noir and more, each tile showing your own photo, with a strength slider.
  * Bring your own .cube LUTs as looks, or make your own look from steps.
  * Presets: save the whole edit or only parts of it, apply them with one click, preview them by resting on them.
  * Bring your Lightroom and Camera Raw presets (.xmp).

  **Every control you expect**

  * Light, colour, curves, colour mixer, colour grading, detail, effects and optics, with a histogram and clipping warnings.
  * Crop and rotate, straighten with a dial or a drawn line, fix leaning buildings, and square a page or a wall from its four corners.
  * Heal blemishes, dust and small objects with a spot or a brush.
  * Camera RAW, HEIC, AVIF and JPEG XL photos, with lens corrections from the Lensfun database.

  **Many photos at once**

  * Batch: process whole folders with a preset, a size, a watermark and a format, in the background.
  * Export to JPEG, PNG, TIFF, WebP and more, with sizes for the web and for print.
  * Your edits are kept for every photo, and the original file is never changed.

  Bugs and requests: https://github.com/keshavbhatt/PixelFx/issues
website: https://github.com/keshavbhatt/PixelFx
issues: https://github.com/keshavbhatt/PixelFx/issues
source-code: https://github.com/keshavbhatt/PixelFx
license: GPL-3.0-or-later

platforms:
  amd64:
  arm64:

apps:
  pixelfx:
    command: usr/bin/pixelfx
    desktop: usr/share/applications/com.ktechpit.pixelfx.desktop
    common-id: com.ktechpit.pixelfx
    extensions:
      - kde-neon-6
    environment:
      # libvips and the codecs built below, and the image libraries staged from Ubuntu; the
      # runtime's launcher adds only its own folders.
      LD_LIBRARY_PATH: $SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    plugs:
      - home
      - removable-media # photos on cards and external drives
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - unity7

parts:
  # SIMD for libjxl; static, linked into libjxl.
  highway:
    plugin: cmake
    source: https://github.com/google/highway/archive/refs/tags/1.4.0.tar.gz
    source-checksum: sha256/e72241ac9524bb653ae52ced768b508045d4438726a303f10181a38f764a453c
    build-snaps: [cmake/latest/stable]
    build-packages: [ninja-build]
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DBUILD_TESTING=OFF
      - -DHWY_ENABLE_CONTRIB=OFF
      - -DHWY_ENABLE_EXAMPLES=OFF
      - -DHWY_ENABLE_TESTS=OFF
      - -DHWY_ENABLE_INSTALL=ON
    prime: [-*]

  # JPEG XL, read and write.
  libjxl:
    after: [highway]
    plugin: cmake
    source: https://github.com/libjxl/libjxl/archive/refs/tags/v0.12.0.tar.gz
    source-checksum: sha256/03e9be69a30be4011f559da75328b6d7cea8ad921fabfbd551ce10bf45cdc992
    build-snaps: [cmake/latest/stable]
    build-packages: [ninja-build, pkgconf, libbrotli-dev, liblcms2-dev]
    stage-packages: [libbrotli1, liblcms2-2]
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DJPEGXL_FORCE_SYSTEM_BROTLI=ON
      - -DJPEGXL_FORCE_SYSTEM_LCMS2=ON
      - -DJPEGXL_FORCE_SYSTEM_HWY=ON
      - -DJPEGXL_ENABLE_SKCMS=OFF
      - -DJPEGXL_ENABLE_TOOLS=OFF
      - -DJPEGXL_ENABLE_DEVTOOLS=OFF
      - -DJPEGXL_ENABLE_FUZZERS=OFF
      - -DJPEGXL_ENABLE_DOXYGEN=OFF
      - -DJPEGXL_ENABLE_MANPAGES=OFF
      - -DJPEGXL_ENABLE_BENCHMARK=OFF
      - -DJPEGXL_ENABLE_EXAMPLES=OFF
      - -DJPEGXL_ENABLE_JNI=OFF
      - -DJPEGXL_ENABLE_SJPEG=OFF
      - -DJPEGXL_ENABLE_OPENEXR=OFF
      - -DJPEGXL_ENABLE_TCMALLOC=OFF
      - -DJPEGXL_ENABLE_PLUGINS=OFF
      - -DJPEGXL_ENABLE_VIEWERS=OFF
      - -DJPEGXL_ENABLE_JPEGLI=OFF
      - -DJPEGXL_BUNDLE_LIBPNG=OFF

  # AV1 decoding for AVIF; static, linked into libheif.
  dav1d:
    plugin: meson
    source: https://downloads.videolan.org/pub/videolan/dav1d/1.5.4/dav1d-1.5.4.tar.xz
    source-checksum: sha256/686616b7c69eb88d44459391ab25cac13b6647a3b288835c5784e71c1514a5c5
    build-packages:
      - meson
      - ninja-build
      - on amd64: [nasm]
    meson-parameters:
      - --prefix=/usr
      - --libdir=lib
      - --buildtype=release
      - --default-library=static
      - -Denable_tools=false
      - -Denable_examples=false
      - -Denable_tests=false
      - -Denable_docs=false
      - -Dxxhash_muxer=disabled
    prime: [-*]

  # HEVC decoding for HEIC; static, linked into libheif.
  libde265:
    plugin: cmake
    source: https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz
    source-checksum: sha256/554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905
    build-snaps: [cmake/latest/stable]
    build-packages: [ninja-build]
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      - -DENABLE_SDL=OFF
      - -DENABLE_DECODER=OFF
      - -DENABLE_ENCODER=OFF
    prime: [-*]

  # HEIC and AVIF, read only: no HEVC encoder (x265 is GPL) and no AV1 encoder (ADR-003).
  libheif:
    after: [dav1d, libde265]
    plugin: cmake
    source: https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz
    source-checksum: sha256/f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475
    build-snaps: [cmake/latest/stable]
    build-packages: [ninja-build, pkgconf]
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TESTING=OFF
      - -DENABLE_PLUGIN_LOADING=OFF
      - -DWITH_LIBDE265=ON
      - -DWITH_LIBDE265_PLUGIN=OFF
      - -DWITH_DAV1D=ON
      - -DWITH_DAV1D_PLUGIN=OFF
      - -DWITH_X265=OFF
      - -DWITH_X264=OFF
      - -DWITH_OpenH264_DECODER=OFF
      - -DWITH_KVAZAAR=OFF
      - -DWITH_UVG266=OFF
      - -DWITH_VVDEC=OFF
      - -DWITH_VVENC=OFF
      - -DWITH_AOM_DECODER=OFF
      - -DWITH_AOM_ENCODER=OFF
      - -DWITH_SvtEnc=OFF
      - -DWITH_RAV1E=OFF
      - -DWITH_JPEG_DECODER=OFF
      - -DWITH_JPEG_ENCODER=OFF
      - -DWITH_OpenJPEG_DECODER=OFF
      - -DWITH_OpenJPEG_ENCODER=OFF
      - -DWITH_OPENJPH_ENCODER=OFF
      - -DWITH_FFMPEG_DECODER=OFF
      - -DWITH_LIBSHARPYUV=OFF
      - -DWITH_HEADER_COMPRESSION=OFF
      - -DWITH_EXAMPLES=OFF
      - -DWITH_EXAMPLE_HEIF_THUMB=OFF
      - -DWITH_EXAMPLE_HEIF_VIEW=OFF
      - -DWITH_GDK_PIXBUF=OFF
      - -DBUILD_DOCUMENTATION=OFF

  # Camera RAW; no OpenMP and no sample programs.
  libraw:
    plugin: autotools
    source: https://www.libraw.org/data/LibRaw-0.22.3.tar.gz
    source-checksum: sha256/789f3c33466210a1a0907f747a97c715d21bbf4af712f257fcbbd90111b227e4
    build-packages: [pkgconf, libjpeg-dev, zlib1g-dev, liblcms2-dev]
    stage-packages: [libjpeg-turbo8, liblcms2-2]
    autotools-configure-parameters:
      - --prefix=/usr
      - --libdir=/usr/lib
      - --disable-static
      - --disable-openmp
      - --disable-examples
      - --enable-jpeg
      - --enable-zlib
      - --enable-lcms

  # Lens profiles and their database (ADR-013); the app finds the database beside itself.
  lensfun:
    plugin: cmake
    source: https://github.com/lensfun/lensfun/archive/refs/tags/v0.3.4.tar.gz
    source-checksum: sha256/dafb39c08ef24a0e2abd00d05d7341b1bf1f0c38bfcd5a4c69cf5f0ecb6db112
    build-snaps: [cmake/latest/stable]
    build-packages: [ninja-build, pkgconf, libglib2.0-dev]
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_TESTS=OFF
      - -DBUILD_LENSTOOL=OFF
      - -DBUILD_DOC=OFF
      - -DINSTALL_PYTHON_MODULE=OFF
      - -DINSTALL_HELPER_SCRIPTS=OFF

  # libvips with the formats PixelFx needs; everything else off.
  libvips:
    after: [libjxl, libheif, libraw]
    plugin: meson
    source: https://github.com/libvips/libvips/releases/download/v8.18.7/vips-8.18.7.tar.xz
    source-checksum: sha256/5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94
    build-packages:
      - meson
      - ninja-build
      - pkgconf
      - libglib2.0-dev
      - libexpat1-dev
      - zlib1g-dev
      - libjpeg-dev
      - libpng-dev
      - libtiff-dev
      - libwebp-dev
      - liblcms2-dev
      - libexif-dev
    stage-packages:
      - libjpeg-turbo8
      - libpng16-16t64
      - libtiff6
      - libwebp7
      - libwebpmux3
      - libwebpdemux2
      - libsharpyuv0
      - liblcms2-2
      - libexif12
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}
    meson-parameters:
      - --prefix=/usr
      - --libdir=lib
      - --buildtype=release
      - -Dauto_features=disabled
      - -Ddeprecated=false
      - -Dexamples=false
      - -Dcplusplus=true
      - -Dmodules=disabled
      - -Dintrospection=disabled
      - -Ddocs=false
      - -Dcpp-docs=false
      - -Dvapi=false
      - -Djpeg=enabled
      - -Dpng=enabled
      - -Dtiff=enabled
      - -Dwebp=enabled
      - -Dlcms=enabled
      - -Dexif=enabled
      - -Dzlib=enabled
      - -Dnsgif=true
      - -Dppm=true
      - -Danalyze=false
      - -Dradiance=false
      - -Dheif=enabled
      - -Djpeg-xl=enabled
      - -Draw=enabled
    prime:
      - -usr/bin

  pixelfx:
    after: [libvips, lensfun]
    plugin: cmake
    source: .
    build-snaps: [cmake/latest/stable]
    build-packages: [git, ninja-build, pkgconf, liblcms2-dev, libjpeg-dev, zlib1g-dev, libglib2.0-dev]
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/usr/lib/pkgconfig:${PKG_CONFIG_PATH:-}
    cmake-generator: Ninja
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DPIXELFX_BUILD_TESTS=OFF
      - -DPFX_WITH_LENSFUN=ON
    override-build: |
      craftctl default
      # The version comes from the CMake project, the one source of truth. A build that is not
      # exactly a version tag (the edge channel) carries the commit: 2.0.0+git1a2b3c4.
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${CRAFT_PART_BUILD}/CMakeCache.txt" | cut -d= -f2 | tr -d '[:space:]')
      if ! git -c safe.directory="*" -C "${CRAFT_PART_SRC}" describe --exact-match --tags --match "v${VER}" >/dev/null 2>&1; then
        HASH=$(git -c safe.directory="*" -C "${CRAFT_PART_SRC}" rev-parse --short=7 HEAD 2>/dev/null || true)
        [ -n "${HASH}" ] && VER="${VER}+git${HASH}"
      fi
      craftctl set version="${VER}"
      # The store's icon.
      mkdir -p "${CRAFT_PART_INSTALL}/meta/gui"
      cp "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/com.ktechpit.pixelfx.png" \
         "${CRAFT_PART_INSTALL}/meta/gui/icon.png"

  # What only building needs stays out of the snap.
  cleanup:
    after: [pixelfx]
    plugin: nil
    override-prime: |
      craftctl default
      rm -rf usr/include usr/lib/pkgconfig usr/lib/cmake usr/share/pkgconfig usr/share/doc usr/share/man
      find usr/lib -name '*.a' -delete
