# PixelFx as a snap: core24 with the KDE Neon 6 extension (Qt 6 and KDE Frameworks from the
# kf6-core24 content snap), built by GitHub Actions only (.github/workflows/snap.yml; ADR-000,
# PLAN section 8). It is built exactly as a dev build is (ADR-015): scripts/build-deps.sh makes
# libvips and the codecs from the pins in scripts/deps-pins.sh against the kde-qt6-core24-sdk
# snap, scripts/dev-build.sh builds PixelFx against the same SDK, and at run time the image
# libraries and Qt come from the kf6-core24 runtime, as in dev runs.
name: pixelfx
adopt-info: pixelfx
grade: stable
confinement: strict
base: core24
compression: lzo

title: PixelFx
summary: Photo editor, filters and presets
description: |
  PixelFx is a quick photo editor for the Linux desktop. Make a photo better while you watch it: one-click looks shown on your own photo, presets, every light and colour control you expect, and batch editing of many photos at once.

  **Looks and presets**

  * Looks: Vivid, Warm, Film, Golden hour, Teal and orange, Noir and more, each tile showing your own photo, with a strength slider.
  * Bring your own .cube LUTs as looks, or make your own look from steps.
  * Presets: save the whole edit or only parts of it, apply them with one click, preview them by resting on them.
  * Bring your Lightroom and Camera Raw presets (.xmp).

  **Every control you expect**

  * Light, colour, curves, colour mixer, colour grading, detail, effects and optics, with a histogram and clipping warnings.
  * Crop and rotate, straighten with a dial or a drawn line, fix leaning buildings, and square a page or a wall from its four corners.
  * Heal blemishes, dust and small objects with a spot or a brush.
  * Camera RAW, HEIC, AVIF and JPEG XL photos, with lens corrections from the Lensfun database.

  **Many photos at once**

  * Batch: process whole folders with a preset, a size, a watermark and a format, in the background.
  * Export to JPEG, PNG, TIFF, WebP and more, with sizes for the web and for print.
  * Your edits are kept for every photo, and the original file is never changed.

  Bugs and requests: https://github.com/keshavbhatt/PixelFx/issues
website: https://github.com/keshavbhatt/PixelFx
issues: https://github.com/keshavbhatt/PixelFx/issues
source-code: https://github.com/keshavbhatt/PixelFx
license: GPL-3.0-or-later

# amd64 only: KDE publishes the kde-qt6-core24-sdk snap for amd64 only (2026-11-07).
platforms:
  amd64:

apps:
  pixelfx:
    command: usr/bin/pixelfx
    desktop: usr/share/applications/com.ktechpit.pixelfx.desktop
    common-id: com.ktechpit.pixelfx
    extensions:
      - kde-neon-6
    environment:
      # libvips and the codecs built below; the runtime's launcher adds only its own folders.
      LD_LIBRARY_PATH: $SNAP/usr/lib
    plugs:
      - home
      - removable-media # photos on cards and external drives
      - desktop
      - desktop-legacy
      - opengl
      - x11
      - wayland
      - unity7

parts:
  pixelfx:
    plugin: nil
    source: .
    build-snaps:
      - cmake/latest/stable # the cmake dev builds use (/snap/cmake)
      - kf6-core24 # the runtime the SDK's libraries resolve into, as in dev builds
    build-packages: [git, curl, make, ninja-build, meson, nasm, pkgconf]
    override-build: |
      # As on a developer's machine (ADR-015): there the SDK's tools are not first on the path, no
      # library path points into the SDK (with it a configure script's test program does not
      # run) and CMake gets the SDK from the build script only.
      unset LD_LIBRARY_PATH CMAKE_PREFIX_PATH
      export PATH="/usr/bin:/bin:${PATH}"
      export PIXELFX_DEPS_PREFIX="${CRAFT_PART_INSTALL}/usr"
      export PIXELFX_MESON=meson
      export PIXELFX_BUILD_DIR="${CRAFT_PART_BUILD}/build/app" # as in dev builds; app/ holds the sources
      export PIXELFX_BUILD_TYPE=Release
      export PIXELFX_CMAKE_ARGS="-DPIXELFX_BUILD_TESTS=OFF -DPFX_WITH_LENSFUN=ON"
      scripts/dev-build.sh # runs scripts/build-deps.sh first
      /snap/cmake/current/bin/cmake --install "${PIXELFX_BUILD_DIR}" --prefix "${CRAFT_PART_INSTALL}/usr"
      # The version comes from the CMake project, the one source of truth. A build that is not
      # exactly a version tag (the edge channel) carries the commit: 2.0.0+git1a2b3c4.
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${PIXELFX_BUILD_DIR}/CMakeCache.txt" | cut -d= -f2 | tr -d '[:space:]')
      if ! git -c safe.directory="*" -C "${CRAFT_PART_SRC}" describe --exact-match --tags --match "v${VER}" >/dev/null 2>&1; then
        HASH=$(git -c safe.directory="*" -C "${CRAFT_PART_SRC}" rev-parse --short=7 HEAD 2>/dev/null || true)
        [ -n "${HASH}" ] && VER="${VER}+git${HASH}"
      fi
      craftctl set version="${VER}"
      # The store's icon.
      mkdir -p "${CRAFT_PART_INSTALL}/meta/gui"
      cp "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/512x512/apps/com.ktechpit.pixelfx.png" \
         "${CRAFT_PART_INSTALL}/meta/gui/icon.png"
    prime:
      # What only building needs stays out of the snap.
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/lib/cmake
      - -usr/lib/*.a
      - -usr/lib/libraw.so* # libvips links the thread-safe libraw_r
      - -usr/bin/vips*
      - -usr/bin/heif-*
      - -usr/bin/*raw*
      - -usr/local
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/gtk-doc
      - -usr/share/pkgconfig
      - -usr/.deps-stamp
