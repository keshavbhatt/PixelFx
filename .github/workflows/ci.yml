# Builds and tests libpixelfx and the app on Linux, Windows and macOS for every push and pull
# request that changes more than the documents (PLAN D19). The snap workflow runs after this one
# succeeds on main; the Flatpak has its own (M7). ccache keeps each job's compiled objects
# between runs.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['DOCS/**', 'README.md', 'CLAUDE.md', 'LICENSING.md']
  pull_request:
    paths-ignore: ['DOCS/**', 'README.md', 'CLAUDE.md', 'LICENSING.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.3"

jobs:
  linux:
    name: Linux (GCC, warnings as errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 500M
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkgconf libvips-dev liblcms2-dev \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPIXELFX_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows (MSVC, vcpkg)
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      # aqtinstall (behind install-qt-action) cannot read Qt 6.11's per-compiler Windows
      # repository yet; scripts/ci/fetch-qt.py reads it and checks every archive's SHA-1.
      - name: Qt
        shell: pwsh
        run: |
          $prefix = python scripts/ci/fetch-qt.py --host windows_x86 --version $env:QT_VERSION `
            --compiler msvc2022_64 --modules qtbase qtsvg qtimageformats qttools --dest C:/Qt
          "Qt6_DIR=$prefix/lib/cmake/Qt6" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 500M
      # ccache caches MSVC objects only with the debug information inside them (/Z7, the
      # Embedded format), not in a shared .pdb (/Zi, RelWithDebInfo's default).
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    name: macOS (Clang, Homebrew)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}
          max-size: 500M
      - name: Libraries
        run: brew install ninja pkgconf vips little-cms2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
