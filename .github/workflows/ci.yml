# Builds and tests libpixelfx and the app on Linux, Windows and macOS for every push and pull
# request (PLAN D19). The snap and the Flatpak have their own workflows (M7).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.3"

jobs:
  linux:
    name: Linux (GCC, warnings as errors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkgconf libvips-dev liblcms2-dev \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPIXELFX_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    name: Windows (MSVC, vcpkg)
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
      - name: vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build
        run: cmake --build build
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  macos:
    name: macOS (Clang, Homebrew)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: brew install ninja pkgconf vips little-cms2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
