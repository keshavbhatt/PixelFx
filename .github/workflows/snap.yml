# Builds the snap on GitHub's CI for amd64 and arm64 (never on a developer machine; ADR-000,
# PLAN section 8) and publishes it:
#   CI passed on main   -> edge      (version 2.0.0+git<hash>), the commit CI tested
#   version tag v2.0.0  -> stable    (version 2.0.0; the tag must match project(VERSION))
# Edge is where a build is checked before it is tagged. A commit whose tests fail is never built
# into a snap; one that changes only the documents starts no CI, so no snap either.
#
# Publishing needs the SNAPCRAFT_STORE_CREDENTIALS secret and the repository variable
# PUBLISH_TO_STORE=true; without them the snap is only built. Snaps go to the store, never to
# GitHub's artifact storage.
name: snap

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: snap-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    # After CI: only a push to main that passed (not a pull request's run).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          project=$(awk '/^project\(pixelfx/ {on = 1} on && $1 == "VERSION" {print $2; exit}' CMakeLists.txt)
          if [ "${TAG#v}" != "$project" ]; then
            echo "tag $TAG does not match project(VERSION) $project in CMakeLists.txt" >&2
            exit 1
          fi

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to the Snap Store
        if: >-
          vars.PUBLISH_TO_STORE == 'true' &&
          (github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v'))
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
