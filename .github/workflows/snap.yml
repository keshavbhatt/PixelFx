# Builds the snap on GitHub's CI for amd64 and arm64 (never on a developer machine; ADR-000,
# PLAN section 8) and publishes it:
#   push to main        -> edge      (version 2.0.0+git<hash>)
#   version tag v2.0.0  -> stable    (version 2.0.0; the tag must match project(VERSION))
# Edge is where a build is checked before it is tagged.
#
# Publishing needs the SNAPCRAFT_STORE_CREDENTIALS secret and the repository variable
# PUBLISH_TO_STORE=true; without them the snap is only built, and kept as an artifact.
name: snap

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'libs/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, for the version

      - name: Check that the tag matches the CMake version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          project=$(awk '/^project\(pixelfx/ {on = 1} on && $1 == "VERSION" {print $2; exit}' CMakeLists.txt)
          if [ "${TAG#v}" != "$project" ]; then
            echo "tag $TAG does not match project(VERSION) $project in CMakeLists.txt" >&2
            exit 1
          fi

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Keep the snap
        uses: actions/upload-artifact@v4
        with:
          name: pixelfx-${{ matrix.arch }}-snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 14

      - name: Publish to the Snap Store
        if: >-
          vars.PUBLISH_TO_STORE == 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'edge' }}
