version = 1
SPDX-PackageName = "PixelFx"
SPDX-PackageSupplier = "Keshav Bhatt <connect@ktechpit.com>"
SPDX-PackageDownloadLocation = "https://github.com/keshavbhatt/PixelFx"

# Everything is GPL-3.0-or-later unless a rule below says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020-2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# libpixelfx, the reusable library.
[[annotations]]
path = "libs/pixelfx-core/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "Apache-2.0"

# The licensing module (reserved paths).
[[annotations]]
path = [
    "app/src/modules/AccountAndLicense/**",
    "app/src/core/licensing/**",
    "app/src/services/licensing/**"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "LicenseRef-Ktechpit-Licensing-Module"

# The mock helpers embed Lucide glyph paths (ISC); the rest of the file is ours.
[[annotations]]
path = "DOCS/mocks/mock.js"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Keshav Bhatt (Ktechpit)", "2026 Lucide Icons and Contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later AND ISC"

# UI glyphs from Lucide (ISC), normalised by the rewrite kit's icons/pull.sh.
[[annotations]]
path = "app/src/resources/icons/ui/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"


# The built-in preset catalog: converted from EmulsionPresets (MIT) by scripts/catalog, renamed.
[[annotations]]
path = "app/src/resources/presets/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 peva3", "2026 Keshav Bhatt (Ktechpit)"]
SPDX-License-Identifier = "MIT"

# vcpkg ports, adapted from microsoft/vcpkg (MIT): libvips with the formats PixelFx uses, LibRaw
# without JasPer, zlib with its Xcode fix, pcre2 with its sljit commit named (ADR-015).
[[annotations]]
path = "packaging/vcpkg/ports/**"
precedence = "override"
SPDX-FileCopyrightText = ["Microsoft Corporation", "2026 Keshav Bhatt (Ktechpit)"]
SPDX-License-Identifier = "MIT"
